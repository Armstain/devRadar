name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain server/db/migrations)" ]; then
            echo "::error::server/db/schema.ts changed without a migration. Run npm run db:generate and commit the result."
            git status --porcelain server/db/migrations
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          # Placeholder keys: the build only checks their format.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder

  # Live eval of job-post extraction against the real model. Skips (and
  # passes) when the repository has no GEMINI_API_KEY secret, e.g. on forks.
  eval:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
